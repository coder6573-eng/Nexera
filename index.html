<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfcf9"><meta name="description" content="Nexera AI — describe it, and build it.">
<title>Nexera AI</title>
<style>
:root{color-scheme:light;--bg:#fbfcf9;--surface:#fff;--ink:#263329;--muted:#879187;--line:#e8ede5;--soft:#f2f7ee;--green:#79b94d;--green-dark:#477b35;--green-pale:#e8f4df;--shadow:0 12px 35px rgba(53,83,42,.08)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b8dda0;outline-offset:2px}
#app{height:100%;height:100dvh;display:flex;flex-direction:column}.topbar{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(232,237,229,.7);background:rgba(251,252,249,.94);z-index:3}.icon-btn{width:42px;height:42px;border:0;background:transparent;border-radius:13px;color:#667365;display:grid;place-items:center}.icon-btn:hover{background:var(--soft)}.brand{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;font-size:19px;font-weight:780;letter-spacing:-.6px;white-space:nowrap}.brand-mark{width:32px;height:32px;border-radius:11px;background:#e5f3dc;color:var(--green-dark);display:grid;place-items:center}.brand-mark svg{width:21px;height:21px}.top-actions{display:flex;align-items:center;gap:6px}.top-actions .icon-btn{font-size:18px}
#main{position:relative;min-height:0;flex:1;display:flex;flex-direction:column;width:100%;max-width:900px;margin:0 auto;padding:0 18px}.home{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:0 0 14px}.home-brand{display:flex;align-items:center;gap:11px;margin-top:clamp(54px,14vh,132px);font-size:clamp(27px,6vw,34px);font-weight:800;letter-spacing:-1.1px}.home-brand .brand-mark{width:48px;height:48px;border-radius:16px}.home-brand .brand-mark svg{width:30px;height:30px}.home-gap{flex:1;min-height:35px}.composer{width:100%;max-width:760px;border:1px solid #e2e9dd;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);padding:12px 14px 11px;transition:border-color .2s,box-shadow .2s}.composer:focus-within{border-color:#b5d79e;box-shadow:0 12px 36px rgba(83,132,60,.12)}.composer textarea{display:block;width:100%;min-height:48px;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);padding:8px 5px;font-size:15px;line-height:1.55;overflow-y:auto}.composer textarea::placeholder{color:#a0a99c}.composer-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px}.composer-left,.composer-right{display:flex;align-items:center;gap:8px}.round-action{width:36px;height:36px;border:0;border-radius:12px;background:var(--soft);color:#62725d;display:grid;place-items:center}.send{width:39px;height:39px;border:0;border-radius:13px;background:#dcedd2;color:#3e6c31;display:grid;place-items:center;font-size:20px;font-weight:700}.send:disabled{opacity:.5}.send:not(:disabled):hover{background:#cce7bd}.hint{font-size:10px;color:#a0a89d;text-align:center;margin:11px 0 0}
#conversation{display:none;flex:1;min-height:0;overflow:auto;padding:25px 2px 24px;scroll-behavior:smooth}.message{max-width:min(86%,680px);margin:0 0 22px;font-size:14px;line-height:1.75;overflow-wrap:anywhere;white-space:pre-wrap}.message.user{margin-left:auto;background:#edf5e8;border:1px solid #e1ecd9;border-radius:18px 18px 5px 18px;padding:12px 15px}.message.assistant{margin-right:auto;padding:4px 2px}.assistant-label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:750;color:var(--green-dark);margin-bottom:7px}.assistant-label .mini-mark{width:22px;height:22px;border-radius:8px;background:#e6f2de;display:grid;place-items:center}.task-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:13px 14px;margin-top:12px;box-shadow:0 5px 20px rgba(40,70,30,.04)}.task-title{font-size:12px;font-weight:750;margin-bottom:9px}.task-row{display:flex;align-items:flex-start;gap:9px;padding:6px 0;color:#667064;font-size:12px}.task-row svg{flex:none;color:var(--green-dark);margin-top:1px}.task-row.active{color:#365d2d}.task-row.done{color:#8a9586}.typing{display:inline-flex;gap:4px;padding:8px 0}.typing i{width:6px;height:6px;border-radius:50%;background:#90b77b;animation:bounce 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
#chatComposer{display:none;flex:none;padding:10px 0 max(10px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 16%)}#chatComposer .composer{max-width:760px;margin:auto}.chat-hint{font-size:10px;text-align:center;color:#a1a99e;padding:7px 0 0}
.drawer-scrim{position:fixed;inset:0;background:rgba(39,53,37,.18);z-index:8;display:none}.drawer{position:fixed;z-index:9;left:0;top:0;bottom:0;width:min(310px,86vw);background:#fff;border-right:1px solid var(--line);box-shadow:18px 0 50px rgba(30,50,25,.12);transform:translateX(-105%);transition:transform .23s ease;padding:18px 14px;display:flex;flex-direction:column}.drawer.open{transform:translateX(0)}.drawer-scrim.open{display:block}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:2px 5px 20px}.drawer-title{font-weight:800;font-size:17px}.drawer-item{width:100%;display:flex;align-items:center;gap:11px;padding:12px 13px;border:0;border-radius:12px;background:transparent;color:#53604f;text-align:left;font-size:13px}.drawer-item:hover,.drawer-item.selected{background:#f0f6eb;color:#3f7131}.drawer-section{font-size:10px;font-weight:750;letter-spacing:.8px;color:#a0aa9a;padding:20px 12px 8px}.project-list{overflow:auto;min-height:0}.project-entry{display:flex;align-items:center;gap:7px}.project-entry .open-project{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-entry .archive-one{border:0;background:transparent;color:#9ba597;padding:7px;border-radius:8px}.drawer-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
#projectView{display:none;position:absolute;inset:0;background:var(--bg);z-index:4;flex-direction:column;padding:0 18px 15px;min-height:0}.project-head{display:flex;align-items:center;gap:10px;min-height:64px;flex:none}.project-name{font-size:16px;font-weight:760;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);flex:none}.project-tab{border:0;background:transparent;color:#7d8978;padding:12px 15px;font-size:12px;border-bottom:2px solid transparent}.project-tab.active{color:var(--green-dark);border-color:var(--green)}.project-content{flex:1;min-height:0;overflow:auto;padding:15px 0}.file-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;color:#586453;font-size:13px}.file-row.active{border-color:#b8d7a8;background:#f8fcf5}.file-editor{width:100%;min-height:240px;resize:vertical;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;color:#33402f;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;tab-size:2}.preview-frame{width:100%;height:100%;min-height:330px;border:1px solid var(--line);border-radius:14px;background:white}.primary-btn,.secondary-btn{border:0;border-radius:12px;padding:11px 15px;font-size:12px;font-weight:700}.primary-btn{background:#dcedd2;color:#3f7131}.secondary-btn{background:#fff;border:1px solid var(--line);color:#62705e}.project-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}
.modal-backdrop{position:fixed;inset:0;background:rgba(40,53,37,.24);z-index:12;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex}.modal{width:min(430px,100%);max-height:85dvh;overflow:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(30,50,25,.17)}.modal h2{font-size:17px;margin:0 0 8px}.modal p{font-size:12px;line-height:1.6;color:#7f8b7a;margin:0 0 16px}.field{display:block;width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:7px 0 13px;background:#fff;color:var(--ink);font-size:13px}.field-label{font-size:11px;color:#687564;font-weight:700}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{color:#98a193;text-align:center;font-size:12px;padding:28px 12px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#344a30;color:white;padding:10px 15px;border-radius:12px;font-size:12px;z-index:20;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}@media(max-width:560px){.topbar{height:58px;padding:0 11px}.brand{font-size:17px}.home-brand{margin-top:clamp(42px,12vh,105px)}#main{padding:0 12px}.message{max-width:94%}#projectView{padding:0 12px 12px}.project-tab{padding:11px 12px}.composer{border-radius:19px}.hint{margin-top:8px}}@media(min-height:780px){.home-brand{margin-top:16vh}}
</style>
</head>
<body>
<div id="app">
<header class="topbar"><button class="icon-btn" id="menuBtn" aria-label="Open sidebar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button><div class="brand"><span class="brand-mark"><svg viewBox="0 0 48 48" fill="none"><rect x="9" y="13" width="30" height="26" rx="9" stroke="currentColor" stroke-width="2.8"/><path d="M24 7v6" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><circle cx="24" cy="5" r="2.5" fill="currentColor"/><circle cx="19" cy="25" r="2.5" fill="currentColor"/><circle cx="29" cy="25" r="2.5" fill="currentColor"/><path d="M19 32q5 4 10 0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>Nexera AI</div><div class="top-actions"><button class="icon-btn" id="newChatBtn" aria-label="New chat">＋</button></div></header>
<main id="main">
<section class="home" id="home"><div class="home-brand"><span class="brand-mark"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><rect x="9" y="13" width="30" height="26" rx="9"/><path d="M24 7v6"/><circle cx="24" cy="5" r="2.5" fill="currentColor" stroke="none"/><circle cx="19" cy="25" r="2.5" fill="currentColor" stroke="none"/><circle cx="29" cy="25" r="2.5" fill="currentColor" stroke="none"/><path d="M19 32q5 4 10 0"/></svg></span>Nexera AI</div><div class="home-gap"></div><div class="composer"><textarea id="homePrompt" rows="1" placeholder="Message Nexera AI..." aria-label="Message Nexera AI"></textarea><div class="composer-row"><div class="composer-left"><button class="round-action" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button></div><div class="composer-right"><button class="send" id="homeSend" aria-label="Send">↑</button></div></div></div><div class="hint">Describe what you want to build or ask anything</div></section>
<section id="conversation" aria-live="polite"></section>
<div id="chatComposer"><div class="composer"><textarea id="chatPrompt" rows="1" placeholder="Message Nexera AI..." aria-label="Message Nexera AI"></textarea><div class="composer-row"><div class="composer-left"><button class="round-action" id="chatSettings" aria-label="Settings">⚙</button></div><div class="composer-right"><button class="send" id="chatSend" aria-label="Send">↑</button></div></div></div><div class="chat-hint">Nexera can create and update browser projects</div></div>
<section id="projectView"><div class="project-head"><button class="icon-btn" id="backChat" aria-label="Back to chat">←</button><div class="project-name" id="projectTitle">Project</div><button class="icon-btn" id="projectMore" aria-label="Project options">⋯</button></div><nav class="project-tabs"><button class="project-tab active" data-tab="files">Files</button><button class="project-tab" data-tab="preview">Preview</button><button class="project-tab" data-tab="export">Export</button></nav><div class="project-content" id="projectContent"></div></section>
</main>
</div>
<div class="drawer-scrim" id="scrim"></div><aside class="drawer" id="drawer"><div class="drawer-head"><div class="drawer-title">Nexera AI</div><button class="icon-btn" id="closeDrawer">×</button></div><button class="drawer-item" id="newProject">＋　New project</button><div class="drawer-section">PROJECTS</div><div class="project-list" id="projectList"></div><div class="drawer-section">LIBRARY</div><button class="drawer-item" id="showArchives">▤　Archived projects</button><div class="drawer-bottom"><button class="drawer-item" id="drawerSettings">⚙　Settings</button></div></aside>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), STORE='nexera.projects.v1', SETTINGS='nexera.settings.v1';
let projects=loadProjects(),activeProject=null,activeFile='index.html',activeTab='files',messages=[],busy=false,taskItems=[];
const filesDefault=()=>({'index.html':'<!doctype html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>My Project</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <main><h1>Hello, world!</h1><p>Your project starts here.</p></main>\n  <script src="script.js"><\\/script>\n</body>\n</html>','style.css':'* { box-sizing: border-box; }\nbody { margin: 0; font-family: system-ui, sans-serif; color: #243323; background: #f7faf4; }\nmain { max-width: 800px; margin: 10vh auto; padding: 24px; }\nh1 { color: #477b35; }','script.js':'console.log("Hello from Nexera!");'});
function loadProjects(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return []}}function saveProjects(){localStorage.setItem(STORE,JSON.stringify(projects))}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function openDrawer(){ $('drawer').classList.add('open');$('scrim').classList.add('open');renderProjects()}function closeDrawer(){$('drawer').classList.remove('open');$('scrim').classList.remove('open')}
function showHome(){ $('home').style.display='flex';$('conversation').style.display='none';$('chatComposer').style.display='none';$('projectView').style.display='none';$('homePrompt').focus()}
function startChat(){ $('home').style.display='none';$('conversation').style.display='block';$('chatComposer').style.display='block';$('projectView').style.display='none'}
function addMessage(text,role){const d=document.createElement('div');d.className='message '+role;if(role==='assistant'){const l=document.createElement('div');l.className='assistant-label';l.innerHTML='<span class="mini-mark">✦</span>NEXERA AI';d.appendChild(l)}const p=document.createElement('div');p.textContent=text;d.appendChild(p);$('conversation').appendChild(d);$('conversation').scrollTop=$('conversation').scrollHeight;return p}
function renderTasks(items,active){const box=document.createElement('div');box.className='task-card';const title=document.createElement('div');title.className='task-title';title.textContent='Working on your request';box.appendChild(title);items.forEach((it,i)=>{const row=document.createElement('div');row.className='task-row '+(i<active?'done':i===active?'active':'');row.innerHTML='<span>'+(i<active?'✓':i===active?'◌':'○')+'</span>';const tx=document.createElement('span');tx.textContent=it;row.appendChild(tx);box.appendChild(row)});$('conversation').appendChild(box);$('conversation').scrollTop=$('conversation').scrollHeight;return box}
function getSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS)||'{}')}catch{return {}}}
function saveSettings(s){localStorage.setItem(SETTINGS,JSON.stringify(s))}
function secretAvailable(provider){return !!window.NexeraNative&&window.NexeraNative.hasApiKey(provider)}
function nativeCall(provider,endpoint,model,msgs){return new Promise((resolve,reject)=>{const id='r'+Date.now()+Math.random().toString(16).slice(2);const timer=setTimeout(()=>{delete window.__nexeraCallbacks[id];reject(new Error('The model request timed out.'))},120000);window.__nexeraCallbacks=window.__nexeraCallbacks||{};window.__nexeraCallbacks[id]=data=>{clearTimeout(timer);delete window.__nexeraCallbacks[id];if(data.error)reject(new Error(data.error));else resolve(data.content||'')};if(window.NexeraNative){window.NexeraNative.chat(provider,endpoint,model,JSON.stringify(msgs),id)}else{clearTimeout(timer);delete window.__nexeraCallbacks[id];reject(new Error('Secure API-key storage is available in the Android app. Open Nexera APK to connect a model.'))}})}
window.onNexeraNativeResult=(id,json)=>{try{const data=JSON.parse(json);window.__nexeraCallbacks?.[id]?.(data)}catch(e){window.__nexeraCallbacks?.[id]?.({error:'Invalid native response'})}};
function providerConfig(){const s=getSettings();return {provider:s.provider||'deepseek',endpoint:s.endpoint||'https://api.deepseek.com/chat/completions',model:s.model||'deepseek-chat'}}
const SYSTEM='You are Nexera AI, a helpful assistant that can create small browser projects. Never reveal private reasoning. If the user asks to create or modify a website/app, respond ONLY with one valid JSON object (no markdown fences) in this exact shape: {"kind":"project","name":"Short project name","summary":"Brief user-facing summary","tasks":["Short visible task","..."],"files":{"index.html":"complete HTML","style.css":"complete CSS","script.js":"complete JS"}}. Include all three files with complete contents. Use responsive accessible design. Do not use external scripts or libraries unless the user explicitly requests them. If the user is just chatting or asking a question, respond normally in plain text. For an existing project modification, the current project files will be included in the user message; return all three updated files.';
async function send(text,fromHome){if(!text.trim()||busy)return;const value=text.trim();if(fromHome)startChat();addMessage(value,'user');messages.push({role:'user',content:value});const cfg=providerConfig();if(!secretAvailable(cfg.provider)){addMessage('Before I can answer, add an API key in Settings. Your key is kept on this device.','assistant');busy=false;return}busy=true;$('homeSend').disabled=$('chatSend').disabled=true;const tasks=['Understanding your request','Planning the project changes','Creating or updating files','Checking the result'];const taskCard=renderTasks(tasks,0);const waiting=addMessage('','assistant');waiting.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';try{let promptMessages=[{role:'system',content:SYSTEM},...messages];if(activeProject){promptMessages.push({role:'user',content:'Current project files:\n'+JSON.stringify(activeProject.files)+'\nPlease apply the requested changes and return all three complete files.'})}const raw=await nativeCall(cfg.provider,cfg.endpoint,cfg.model,promptMessages);waiting.textContent='';let parsed=null;try{parsed=JSON.parse(raw)}catch{}if(parsed?.kind==='project'&&parsed.files&&['index.html','style.css','script.js'].every(k=>typeof parsed.files[k]==='string')){waiting.textContent=parsed.summary||'Your project is ready.';messages.push({role:'assistant',content:parsed.summary||'Project created.'});const project={id:activeProject?.id||crypto.randomUUID(),name:parsed.name||'Untitled project',files:parsed.files,archived:false,updated:Date.now()};const idx=projects.findIndex(p=>p.id===project.id);if(idx>=0)projects[idx]=project;else projects.unshift(project);activeProject=project;saveProjects();renderProjects();taskCard.replaceWith(renderTasks(tasks,4));openProject(project.id,'files')}else{waiting.textContent=raw;messages.push({role:'assistant',content:raw});taskCard.remove()}}catch(e){waiting.textContent='I could not complete that request.';const err=document.createElement('div');err.className='task-row';err.textContent=e.message;waiting.appendChild(err);taskCard.remove()}finally{busy=false;$('homeSend').disabled=$('chatSend').disabled=false;$('chatPrompt').value='';$('conversation').scrollTop=$('conversation').scrollHeight}}
function submitHome() {const t=$('homePrompt').value; $('homePrompt').value='';send(t,true)}function submitChat(){const t=$('chatPrompt').value;$('chatPrompt').value='';send(t,false)}
function renderProjects(){const list=$('projectList');list.innerHTML='';const visible=projects.filter(p=>!p.archived);if(!visible.length){list.innerHTML='<div class="empty">Your projects will appear here.</div>';return}visible.forEach(p=>{const row=document.createElement('div');row.className='project-entry';const b=document.createElement('button');b.className='drawer-item open-project';b.textContent='▧　'+p.name;b.onclick=()=>{closeDrawer();openProject(p.id,'files')};const a=document.createElement('button');a.className='archive-one';a.textContent='⋯';a.title='Archive project';a.onclick=()=>{p.archived=true;saveProjects();renderProjects();toast('Project archived')};row.append(b,a);list.appendChild(row)})}
function openProject(id,tab){activeProject=projects.find(p=>p.id===id);if(!activeProject)return;activeTab=tab||'files';$('projectTitle').textContent=activeProject.name;$('home').style.display='none';$('conversation').style.display='none';$('chatComposer').style.display='none';$('projectView').style.display='flex';document.querySelectorAll('.project-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));renderProjectContent()}
function renderProjectContent(){const c=$('projectContent');c.innerHTML='';if(activeTab==='files'){Object.keys(activeProject.files).forEach(file=>{const b=document.createElement('button');b.className='file-row '+(file===activeFile?'active':'');b.textContent='▤　'+file;b.onclick=()=>{activeFile=file;renderProjectContent()};c.appendChild(b)});const editor=document.createElement('textarea');editor.className='file-editor';editor.spellcheck=false;editor.value=activeProject.files[activeFile]||'';editor.addEventListener('input',()=>{activeProject.files[activeFile]=editor.value;activeProject.updated=Date.now();saveProjects()});c.appendChild(editor);const actions=document.createElement('div');actions.className='project-actions';const preview=document.createElement('button');preview.className='primary-btn';preview.textContent='Preview project';preview.onclick=()=>switchTab('preview');actions.append(preview);c.append(actions)}else if(activeTab==='preview'){const html=activeProject.files['index.html'].replace(/<link[^>]+href=["']style\.css["'][^>]*>/i,'<style>'+activeProject.files['style.css']+'</style>').replace(/<script[^>]+src=["']script\.js["'][^>]*><\\/script>/i,'<script>'+activeProject.files['script.js'].replace(/<\\/script/gi,'<\\\\/script')+'<\\/script>');if(window.NexeraNative){const frame=document.createElement('div');frame.className='empty';frame.textContent='Open the secure isolated preview on your device.';const b=document.createElement('button');b.className='primary-btn';b.textContent='Open preview';b.onclick=()=>window.NexeraNative.showPreview(html);c.append(frame,b)}else{const frame=document.createElement('iframe');frame.className='preview-frame';frame.setAttribute('sandbox','allow-scripts');frame.srcdoc=html;c.append(frame)}}else{const p=document.createElement('p');p.textContent='Export your project as a ZIP file containing index.html, style.css and script.js.';p.style.color='#7f8b7a';p.style.fontSize='13px';c.append(p);const b=document.createElement('button');b.className='primary-btn';b.textContent='Download project ZIP';b.onclick=()=>{if(window.NexeraNative)window.NexeraNative.exportZip(activeProject.name,JSON.stringify(activeProject.files));else downloadZipFallback(activeProject)};c.append(b)}}
function switchTab(tab){activeTab=tab;document.querySelectorAll('.project-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderProjectContent()}
function downloadZipFallback(project){toast('ZIP export is available in the Android app build.')}
function showArchives(){closeDrawer();const archived=projects.filter(p=>p.archived);showModal('<h2>Archived projects</h2><p>Restore a project to bring it back to your project list.</p>'+ (archived.length?archived.map(p=>'<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf0e9"><span class="archive-name"></span><button class="secondary-btn restore-btn" data-id="'+p.id+'">Restore</button></div>').join(''):'<div class="empty">No archived projects.</div>')+'<div class="modal-actions"><button class="secondary-btn" id="modalClose">Close</button></div>');document.querySelectorAll('.archive-name').forEach((e,i)=>e.textContent=archived[i].name);document.querySelectorAll('.restore-btn').forEach(b=>b.onclick=()=>{const p=projects.find(x=>x.id===b.dataset.id);p.archived=false;saveProjects();hideModal();renderProjects();toast('Project restored')});$('modalClose').onclick=hideModal}
function showModal(html){$('modal').innerHTML=html;$('modalBackdrop').classList.add('open')}function hideModal(){$('modalBackdrop').classList.remove('open')}
function showSettings(){const s=getSettings();showModal('<h2>Model settings</h2><p>Connect a compatible AI provider. In the Android app, your API key is encrypted with Android Keystore and never exposed to the web interface.</p><label class="field-label">Provider</label><select class="field" id="provider"><option value="deepseek">DeepSeek</option><option value="glm">GLM / Zhipu</option><option value="qwen">Qwen / DashScope</option><option value="custom">Custom OpenAI-compatible</option></select><label class="field-label">API endpoint (HTTPS)</label><input class="field" id="endpoint" placeholder="https://api.deepseek.com/chat/completions"><label class="field-label">Model ID</label><input class="field" id="modelId" placeholder="deepseek-chat"><label class="field-label">API key</label><input class="field" id="apiKey" type="password" autocomplete="off" placeholder="Paste your API key"><div style="font-size:10px;color:#71806d">API keys are encrypted with Android Keystore in the APK. Browser preview does not store keys.</div><div class="modal-actions"><button class="secondary-btn" id="deleteKey">Delete saved key</button><button class="secondary-btn" id="cancelSettings">Cancel</button><button class="primary-btn" id="saveSettings">Save settings</button></div>');$('provider').value=s.provider||'deepseek';$('endpoint').value=s.endpoint||'https://api.deepseek.com/chat/completions';$('modelId').value=s.model||'deepseek-chat';$('provider').onchange=()=>{const v=$('provider').value;const cfg={deepseek:['https://api.deepseek.com/chat/completions','deepseek-chat'],glm:['https://open.bigmodel.cn/api/paas/v4/chat/completions','glm-4.5-flash'],qwen:['https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions','qwen-plus'],custom:['','']};$('endpoint').value=cfg[v][0];$('modelId').value=cfg[v][1]};$('cancelSettings').onclick=hideModal;$('saveSettings').onclick=()=>{const data={provider:$('provider').value,endpoint:$('endpoint').value.trim(),model:$('modelId').value.trim()};if(!data.endpoint.startsWith('https://')||!data.model){toast('Enter a valid HTTPS endpoint and model');return}const key=$('apiKey').value.trim();if(key){if(!window.NexeraNative){toast('Save API keys from the installed Android app.');return}const ok=window.NexeraNative.saveApiKey(data.provider,key);if(!ok){toast('Could not securely save the key');return}}saveSettings(data);hideModal();toast('Settings saved on this device')};$('deleteKey').onclick=()=>{if(!window.NexeraNative){toast('Open the Android app to manage saved keys.');return}const ok=window.NexeraNative.deleteApiKey($('provider').value);toast(ok?'Saved key deleted':'Could not delete saved key')}
$('menuBtn').onclick=openDrawer;$('closeDrawer').onclick=closeDrawer;$('scrim').onclick=closeDrawer;$('newChatBtn').onclick=()=>{messages=[];activeProject=null;$('conversation').innerHTML='';showHome()};$('newProject').onclick=()=>{closeDrawer();messages=[];activeProject=null;$('conversation').innerHTML='';startChat();$('chatPrompt').value='Create a new browser project: ';$('chatPrompt').focus()};$('showArchives').onclick=showArchives;$('settingsBtn').onclick=$('chatSettings').onclick=$('drawerSettings').onclick=showSettings;$('homeSend').onclick=submitHome;$('chatSend').onclick=submitChat;$('homePrompt').onkeydown=$('chatPrompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();e.target=== $('homePrompt')?submitHome():submitChat()}};$('backChat').onclick=()=>{activeProject=null;startChat()};$('projectMore').onclick=()=>{if(!activeProject)return;activeProject.archived=true;saveProjects();$('projectView').style.display='none';showHome();toast('Project archived')};document.querySelectorAll('.project-tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));renderProjects();showHome();
})();
</script>
