name: Build Nexera Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexera-v12-release-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm install --ignore-scripts

      - name: Run UI regression tests
        run: npm test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare WebView assets
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html app/src/main/assets/www/index.html

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Publish APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v12.0.0
          name: Nexera AI v12.0.0
          body: "Nexera AI v12.0.0 — HTML/CSS/JavaScript vibecoding workspace with live preview and free auto routing."
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
