name: Nexera regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexera-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run regression suite
        run: npm test

  windows-package-check:
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop dependencies
        run: npm install
      - name: Run shared regression suite
        run: npm test
      - name: Build portable Windows package (not published)
        run: npm run dist:win

  android-compile-check:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v3
      - name: Install Android 16 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Prepare WebView assets
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html app/src/main/assets/www/index.html
      - name: Compile Android Kotlin sources (no APK)
        run: gradle --no-daemon compileDebugKotlin

  python-backend:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile backend modules
        run: python -m compileall -q app tests
      - name: Run backend tests
        run: pytest -q
