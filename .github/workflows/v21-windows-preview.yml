name: Build Nexera V21 Windows preview

on:
  push:
    branches: [v21-python-agent-redesign]
    paths:
      - "index.html"
      - "package.json"
      - "desktop/**"
      - "scripts/**"
      - ".github/workflows/v21-windows-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexera-v21-windows-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install desktop build dependencies
        run: npm install
      - name: Run frontend regression suite
        run: npm test
      - name: Build portable Windows app
        run: npm run dist:win
      - name: Upload V21 Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexera-v21-windows-portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
