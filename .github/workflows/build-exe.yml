name: Build Nexera Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check application JavaScript
        run: node scripts/check-inline-js.cjs

      - name: Install dependencies
        run: npm install

      - name: Build portable Windows EXE
        run: npm run dist:win

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: nexera-windows-exe
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
