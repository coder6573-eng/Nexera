name: Build Nexera Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexera-v11-release-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run UI regression tests
        run: npm test

      - name: Build portable Windows EXE
        run: npm run dist:win

      - name: Publish Windows release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.0.0
          name: Nexera AI v11.0.0
          body: "Nexera AI v11.0.0 — HTML/CSS/JavaScript vibecoding workspace with live preview and free auto routing."
          files: dist/*.exe
          fail_on_unmatched_files: true
          make_latest: false
