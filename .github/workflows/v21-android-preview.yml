name: Build Nexera V21 Android preview APK

on:
  push:
    branches: [v21-python-agent-redesign]
    paths:
      - "index.html"
      - "package.json"
      - "app/**"
      - "scripts/**"
      - ".github/workflows/v21-android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexera-v21-android-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install regression dependencies
        run: npm install --ignore-scripts
      - name: Run frontend regression suite
        run: npm test
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v3
      - name: Install Android 16 platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Prepare WebView assets
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html app/src/main/assets/www/index.html
      - name: Build Android debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload V21 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexera-v21-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
